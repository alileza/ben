name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g. v0.2.0). Must already exist; the workflow will not create it.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: ver
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build .app
        run: |
          swift build -c release
          ./build.sh

      - name: Sanity-check the bundle
        run: |
          test -f Ben.app/Contents/MacOS/Ben
          test -f Ben.app/Contents/Info.plist
          test -f Ben.app/Contents/Resources/AppIcon.icns
          codesign -dv Ben.app 2>&1 | head -5

      - name: Build .dmg
        id: dmg
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          DMG="Ben-${TAG}.dmg"

          # Staging dir with the .app and a symlink to /Applications so users
          # can drag-to-install from inside the mounted DMG.
          rm -rf dmg-staging
          mkdir -p dmg-staging
          cp -R Ben.app dmg-staging/
          ln -s /Applications dmg-staging/Applications

          hdiutil create \
            -volname "Ben" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            -fs HFS+ \
            "$DMG"

          # Checksum so users can verify integrity
          shasum -a 256 "$DMG" > "${DMG}.sha256"

          echo "dmg=$DMG"   >> "$GITHUB_OUTPUT"
          echo "sha=${DMG}.sha256" >> "$GITHUB_OUTPUT"

          ls -lh "$DMG"

      - name: Write release notes
        id: notes
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          cat > NOTES.md <<EOF
          ## Install

          1. Download \`${{ steps.dmg.outputs.dmg }}\` below.
          2. Open the DMG and drag **Ben.app** to **Applications**.
          3. First launch: **right-click** Ben.app → **Open** to bypass Gatekeeper. This is an ad-hoc-signed build, so macOS doesn't recognize the publisher.
             Alternative one-liner:
             \`\`\`
             xattr -dr com.apple.quarantine /Applications/Ben.app
             \`\`\`
          4. Grant **Microphone** and **Speech Recognition** permissions when prompted.
          5. Make sure **Dictation** is enabled in *System Settings → Keyboard → Dictation*, otherwise \`SFSpeechRecognizer\` won't return results.

          ## Verify the download

          \`\`\`
          shasum -a 256 -c ${{ steps.dmg.outputs.dmg }}.sha256
          \`\`\`

          ## Requirements

          - macOS 15 (Sequoia) or later
          - EN ⇄ DE translation pair (macOS prompts to download on first use)

          ## Changes

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full history.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          # Create the release if it doesn't exist, then upload assets.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Ben $TAG" \
              --notes-file NOTES.md \
              --generate-notes
          fi
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ steps.dmg.outputs.dmg }}" \
            "${{ steps.dmg.outputs.sha }}"
